<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صنع نور الدين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0708; --ink2:#160c0a;
    --crimson:#9c1227; --crimsonDeep:#50070f;
    --bronze:#c08a3e; --bronzeDim:#8a6329;
    --text:#f1e6da; --muted:#9c897e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; min-height:100%;
    background:
      radial-gradient(ellipse at 50% -15%, rgba(156,18,39,.35) 0%, transparent 50%),
      linear-gradient(180deg,var(--ink) 0%,var(--ink2) 100%);
    color:var(--text); font-family:"Tajawal",sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:740px;margin:0 auto;padding:40px 18px 60px}

  .hero{text-align:center;margin-bottom:10px}
  h1{
    font-family:"Aref Ruqaa",serif; font-weight:700;
    font-size:clamp(34px,8vw,54px); margin:0; line-height:1.15;
    color:var(--text);
    text-shadow:0 0 18px rgba(156,18,39,.85), 0 2px 0 rgba(0,0,0,.6);
  }
  .ornament{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 30px}
  .ornament .line{height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--bronze))}
  .ornament .line.r{background:linear-gradient(90deg,var(--bronze),transparent)}
  .ornament svg{width:20px;height:20px;flex-shrink:0}

  .card{
    position:relative;
    background:linear-gradient(155deg,#1c0d0d,#120808);
    border:1px solid var(--crimsonDeep); border-radius:4px; padding:26px 22px;
    box-shadow:0 0 0 1px rgba(192,138,62,.18) inset, 0 16px 34px rgba(0,0,0,.55);
    margin-bottom:22px;
  }
  .card::before,.card::after{
    content:""; position:absolute; width:14px; height:14px;
    border:1px solid var(--bronzeDim); top:10px;
  }
  .card::before{right:10px; border-left:none; border-bottom:none}
  .card::after{left:10px; border-right:none; border-bottom:none}

  #drop{
    border:1px dashed var(--crimsonDeep); border-radius:3px; padding:38px 16px;
    text-align:center; cursor:pointer; transition:.2s;
  }
  #drop:hover,#drop.drag{ border-color:var(--crimson); background:rgba(156,18,39,.07) }
  #drop p{margin:0 0 8px;font-size:17px;font-weight:500;color:var(--text)}
  #drop span{color:var(--muted);font-size:13px}
  #fileInput{display:none}

  .row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:18px}
  .box{flex:1;min-width:140px;text-align:center}
  .box h3{margin:0 0 10px;color:var(--bronze);font-size:13px;font-weight:500}
  .frame{
    display:inline-block;max-width:100%;border-radius:3px;overflow:hidden;
    background:
      linear-gradient(45deg,#241414 25%,transparent 25%,transparent 75%,#241414 75%),
      linear-gradient(45deg,#241414 25%,transparent 25%,transparent 75%,#241414 75%);
    background-size:16px 16px; background-position:0 0,8px 8px;
    border:1px solid var(--crimsonDeep);
  }
  .frame img,.frame canvas{display:block;max-width:100%;max-height:260px}

  .opts{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
  .opts label{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px;cursor:pointer}
  input[type=checkbox]{width:17px;height:17px;accent-color:var(--crimson)}
  .dims{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}

  .actions{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
  button{
    font-family:"Tajawal",sans-serif; font-size:15px; font-weight:700; cursor:pointer;
    padding:13px 28px; border-radius:3px; border:1px solid var(--bronze);
    background:linear-gradient(165deg,var(--crimson),var(--crimsonDeep)); color:#fff;
    box-shadow:0 6px 18px rgba(156,18,39,.35);
  }
  button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
  button.secondary{background:linear-gradient(165deg,#2a2220,#15100f);border-color:var(--bronzeDim)}

  footer{
    text-align:center;color:var(--muted);font-size:13px;margin-top:34px;
    font-family:"Aref Ruqaa",serif; letter-spacing:.5px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>صنع نور الدين</h1>
    <div class="ornament">
      <span class="line"></span>
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2L12 16.8 5.7 21l2.3-7.2-6-4.6h7.6z" fill="#c08a3e"/></svg>
      <span class="line r"></span>
    </div>
  </div>

  <div class="card">
    <div id="drop">
      <p>اضغط هنا أو اسحب الصورة</p>
      <span>بيشيل الفراغ الشفاف أو المتكرر من الجوانب الأربعة تلقائي</span>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="opts">
      <label><input type="checkbox" id="squareOpt"> اجعلها مربعة بعد التقريب</label>
    </div>

    <div class="row" id="previewRow" style="display:none">
      <div class="box">
        <h3>قبل</h3>
        <div class="frame"><img id="beforeImg"></div>
      </div>
      <div class="box">
        <h3>بعد</h3>
        <div class="frame"><canvas id="afterCanvas"></canvas></div>
      </div>
    </div>
    <div class="dims" id="dims"></div>

    <div class="actions">
      <button id="downloadBtn" disabled>تنزيل الصورة</button>
      <button id="resetBtn" class="secondary" style="display:none">صورة جديدة</button>
    </div>
  </div>

  <footer>صنع نور الدين</footer>
</div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const beforeImg = document.getElementById('beforeImg');
const afterCanvas = document.getElementById('afterCanvas');
const previewRow = document.getElementById('previewRow');
const dims = document.getElementById('dims');
const downloadBtn = document.getElementById('downloadBtn');
const resetBtn = document.getElementById('resetBtn');
const squareOpt = document.getElementById('squareOpt');

let resultBlobUrl = null;

drop.addEventListener('click', () => fileInput.click());
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
squareOpt.addEventListener('change', () => { if (beforeImg.src) process(beforeImg.src); });
resetBtn.addEventListener('click', () => {
  fileInput.value = '';
  previewRow.style.display = 'none';
  dims.textContent = '';
  downloadBtn.disabled = true;
  resetBtn.style.display = 'none';
});

function handleFile(file) {
  if (!file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    beforeImg.src = e.target.result;
    process(e.target.result);
  };
  reader.readAsDataURL(file);
}

function process(src) {
  const img = new Image();
  img.onload = () => {
    try {
      const w = img.naturalWidth, h = img.naturalHeight;
      const tmp = document.createElement('canvas');
      tmp.width = w; tmp.height = h;
      const tctx = tmp.getContext('2d');
      tctx.drawImage(img, 0, 0);
      const data = tctx.getImageData(0, 0, w, h);

      const hasAlpha = checkHasAlpha(data);
      const bg = hasAlpha ? null : sampleCorners(data, w, h);
      const box = findBounds(data, w, h, hasAlpha, bg);

      let cw = box.maxX - box.minX + 1;
      let ch = box.maxY - box.minY + 1;
      let outCanvas = document.createElement('canvas');

      if (squareOpt.checked) {
        const size = Math.max(cw, ch);
        outCanvas.width = size; outCanvas.height = size;
        const octx = outCanvas.getContext('2d');
        const dx = Math.floor((size - cw) / 2);
        const dy = Math.floor((size - ch) / 2);
        octx.drawImage(img, box.minX, box.minY, cw, ch, dx, dy, cw, ch);
      } else {
        outCanvas.width = cw; outCanvas.height = ch;
        const octx = outCanvas.getContext('2d');
        octx.drawImage(img, box.minX, box.minY, cw, ch, 0, 0, cw, ch);
      }

      afterCanvas.width = outCanvas.width;
      afterCanvas.height = outCanvas.height;
      afterCanvas.getContext('2d').drawImage(outCanvas, 0, 0);

      dims.textContent = `الحجم الأصلي: ${w}×${h}  —  بعد التقريب: ${outCanvas.width}×${outCanvas.height}`;
      previewRow.style.display = 'flex';
      resetBtn.style.display = 'inline-block';

      outCanvas.toBlob(blob => {
        if (resultBlobUrl) URL.revokeObjectURL(resultBlobUrl);
        resultBlobUrl = URL.createObjectURL(blob);
        downloadBtn.disabled = false;
      }, 'image/png');
    } catch (err) {
      dims.textContent = 'حصل خطأ أثناء معالجة الصورة، جرب صورة تانية.';
    }
  };
  img.src = src;
}

function checkHasAlpha(data) {
  const d = data.data;
  for (let i = 3; i < d.length; i += 97) { // عينة سريعة
    if (d[i] < 250) return true;
  }
  return false;
}

function sampleCorners(data, w, h) {
  const d = data.data;
  const get = (x, y) => { const i = (y * w + x) * 4; return [d[i], d[i+1], d[i+2]]; };
  const corners = [get(0,0), get(w-1,0), get(0,h-1), get(w-1,h-1)];
  const avg = [0,0,0];
  corners.forEach(c => { avg[0]+=c[0]; avg[1]+=c[1]; avg[2]+=c[2]; });
  return [avg[0]/4, avg[1]/4, avg[2]/4];
}

function findBounds(data, w, h, hasAlpha, bg) {
  const d = data.data;
  const tol = 28;
  const isBackground = (x, y) => {
    const i = (y * w + x) * 4;
    if (hasAlpha) return d[i+3] < 10;
    const dr = d[i]-bg[0], dg = d[i+1]-bg[1], db = d[i+2]-bg[2];
    return Math.sqrt(dr*dr+dg*dg+db*db) < tol;
  };

  let minX = 0, maxX = w-1, minY = 0, maxY = h-1;

  scanTop:
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) if (!isBackground(x,y)) { minY = y; break scanTop; }
    if (y === h-1) minY = 0;
  }
  scanBottom:
  for (let y = h-1; y >= 0; y--) {
    for (let x = 0; x < w; x++) if (!isBackground(x,y)) { maxY = y; break scanBottom; }
    if (y === 0) maxY = h-1;
  }
  scanLeft:
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) if (!isBackground(x,y)) { minX = x; break scanLeft; }
    if (x === w-1) minX = 0;
  }
  scanRight:
  for (let x = w-1; x >= 0; x--) {
    for (let y = 0; y < h; y++) if (!isBackground(x,y)) { maxX = x; break scanRight; }
    if (x === 0) maxX = w-1;
  }

  if (minX > maxX || minY > maxY) { minX=0; minY=0; maxX=w-1; maxY=h-1; }
  return { minX, minY, maxX, maxY };
}

downloadBtn.addEventListener('click', () => {
  if (!resultBlobUrl) return;
  const a = document.createElement('a');
  a.href = resultBlobUrl;
  a.download = 'صنع-نور-الدين.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});
</script>
</body>
</html>
